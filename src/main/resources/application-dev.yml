# Development Profile Configuration
# This profile is designed for local development without requiring certificates

spring:
  application:
    name: dbna-outbound

server:
  port: 3310

# DBNA Network Configuration - Development
dbna:
  from-party-id: ${DBNA_FROM_PARTY_ID:dev-sender}
  from-party-role: ${DBNA_FROM_PARTY_ROLE:http://docs.oasis-open.org/ebxml-msg/ebms/v3.0/ns/core/200704/initiator}
  to-party-role: ${DBNA_TO_PARTY_ROLE:http://docs.oasis-open.org/ebxml-msg/ebms/v3.0/ns/core/200704/responder}
  service-type: ${DBNA_SERVICE_TYPE:}
  service: ${DBNA_SERVICE:http://dbna.opuscapita.com/services}
  receiver:
    url: ${DBNA_RECEIVER_URL:https://localhost:3210/messages}  # Setting this overrides receiver URL acquired from SMP/SML
  retry:
    max-attempts: ${DBNA_RETRY_MAX_ATTEMPTS:3}
    delay: ${DBNA_RETRY_DELAY:1000}
    timeout: ${DBNA_RETRY_TIMEOUT:10000}  # Timeout in milliseconds for AS4 sending (default: 10 seconds)
  sml:
    url: ${DBNA_SML_URL:sml.dbnalliance.com}
    dns-server: ${DBNA_SML_DNS_SERVER:8.8.8.8}
  smp:
    url: ${DBNA_SMP_URL:https://smp.dbnalliance.com/bdxr-smp-2} # Setting this overrides SMP URL acquired from SML

# AS4 Configuration - Development Mode
# Uses in-memory truststore with certificates dynamically injected from SMP queries
as4:
  keystore:
    path: ${KEYSTORE_PATH:test-keystore.p12}
    password: ${KEYSTORE_PASSWORD:testpassword}
    type: ${KEYSTORE_TYPE:PKCS12}
  key:
    alias: ${KEYSTORE_KEY_ALIAS:testcert}
    password: ${KEYSTORE_KEY_PASSWORD:testpassword}
  ssl:
    enabled: true  # SSL enabled for development (receiver uses HTTPS with self-signed cert)
    verify-hostname: false  # Hostname verification disabled for development (localhost)
    protocol: ${SSL_PROTOCOL:TLS}

# Logging - More verbose for development
logging:
  level:
    com.opuscapita.dbna: DEBUG
    com.helger.phase4: DEBUG
    com.helger.commons: INFO
    org.springframework.web: DEBUG
    org.apache.http: DEBUG

# Development-specific settings
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env

