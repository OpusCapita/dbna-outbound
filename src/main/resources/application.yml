app:
  version: @project.version@

spring:
  application:
    name: dbna-outbound
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # Default to dev profile

server:
  port: 3310

# Storage Configuration
storage:
  base-path: ${STORAGE_BASE_PATH:${java.io.tmpdir}/dbna-outbound}

# DBNA Network Configuration
dbna:
  from-party-id: ${DBNA_FROM_PARTY_ID:${spring.application.name}}
  from-party-role: ${DBNA_FROM_PARTY_ROLE:http://docs.oasis-open.org/ebxml-msg/ebms/v3.0/ns/core/200704/initiator}
  to-party-role: ${DBNA_TO_PARTY_ROLE:http://docs.oasis-open.org/ebxml-msg/ebms/v3.0/ns/core/200704/responder}
  service-type: ${DBNA_SERVICE_TYPE:}
  service: ${DBNA_SERVICE:http://dbna.opuscapita.com/services}
  receiver:
    url: ${DBNA_RECEIVER_URL:}  # Setting this overrides receiver URL acquired from SMP/SML
  retry:
    max-attempts: ${DBNA_RETRY_MAX_ATTEMPTS:3}
    delay: ${DBNA_RETRY_DELAY:1000}
    timeout: ${DBNA_RETRY_TIMEOUT:30000}  # Timeout in milliseconds for AS4 message sending (default: 30 seconds)
  sml:
    url: ${DBNA_SML_URL:sml.dbnalliance.net}
    dns-server: ${DBNA_SML_DNS_SERVER:8.8.8.8}
  smp:
    url: ${DBNA_SMP_URL:} # Setting this overrides SMP URL acquired from SML

# Sirius Configuration
sirius:
  url: ${SIRIUS_URL:}
  username: ${SIRIUS_USERNAME:}
  password: ${SIRIUS_PASSWORD:}
  timeout: ${SIRIUS_TIMEOUT:180000}  # Timeout in milliseconds for Sirius HTTP operations (default: 3 minutes)
  size-limit: ${SIRIUS_SIZE_LIMIT:5242880}  # Maximum file size in bytes (5MB default)
  retry-count: ${SIRIUS_RETRY_COUNT:8}  # Number of retries on connection failure
  retry-delay: ${SIRIUS_RETRY_DELAY:900000}  # Delay between retries in milliseconds

# AS4 Configuration with X.509 Certificate Support
# Note: Profile-specific configurations override these defaults
# - Use 'dev' profile for development (no certificates required)
# - Use 'prod' profile for production (certificates required)
as4:
  api:
    token: ${AS4_API_TOKEN:}  # API token for Authorization header (Bearer token). Leave empty to disable token validation.
  keystore:
    path: ${KEYSTORE_PATH:keystore.jks}
    password: ${KEYSTORE_PASSWORD:changeit}
    type: ${KEYSTORE_TYPE:JKS}
  key:
    alias: ${KEYSTORE_KEY_ALIAS:dbna}
    password: ${KEYSTORE_KEY_PASSWORD:changeit}
  ssl:
    enabled: ${SSL_ENABLED:true}
    verify-hostname: ${SSL_VERIFY_HOSTNAME:true}
    protocol: ${SSL_PROTOCOL:TLS}

# Spring Boot Actuator for Kubernetes health probes
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  server:
    port: 3310

# Logging
logging:
  level:
    root: INFO
    com.opuscapita.dbna: DEBUG
    com.opuscapita.dbna.outbound.controller.HealthController: WARN
    com.helger.phase4: DEBUG
    org.springframework.web: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: DEBUG
    org.apache.http: DEBUG
    org.apache.http.wire: DEBUG
    org.apache.http.headers: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %logger{36} - %level: %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %logger{36} - %level: %msg%n"

